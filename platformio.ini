; Programmable PWM LED controller for Mean Well 3-in-1 dimmable drivers
; (HLG/XLG/ELG "B"/"AB" types). Sunrise/sunset schedules, effects, web UI.
[platformio]
default_envs = esp32dev
description = Mean Well LED driver controller with sunrise/sunset, web UI, optional BLE

[env]
; pioarduino fork of the Espressif platform (Arduino core 3.3.x). Already installed locally.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
board_build.filesystem = littlefs
; 1.9 MB app x2 (OTA) + ~190 KB LittleFS for the web UI and config
board_build.partitions = min_spiffs.csv
build_flags =
    -D CORE_DEBUG_LEVEL=2
    -D FW_VERSION=\"0.1.0\"
    -Wall
lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.7.0
    ESP32Async/AsyncTCP @ ^3.3.2
    bblanchon/ArduinoJson @ ^7.3.0
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^4.0.4

; Classic ESP32 (WROOM-32 dev board). 8 PWM channels on 25,26,27,14,32,33,13,23
[env:esp32dev]
board = esp32dev
build_flags = ${env.build_flags} -D BOARD_ESP32_CLASSIC

; Same board with BLE Wi-Fi provisioning enabled (adds NimBLE, ~400 KB flash)
[env:esp32dev-ble]
board = esp32dev
build_flags = ${env.build_flags} -D BOARD_ESP32_CLASSIC -D ENABLE_BLE=1
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino @ ^2.2.3

; ESP32-C3 (RISC-V, cheap, 6 LEDC channels)
[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -D BOARD_ESP32_C3 -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3
[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -D BOARD_ESP32_S3 -D ARDUINO_USB_CDC_ON_BOOT=1
